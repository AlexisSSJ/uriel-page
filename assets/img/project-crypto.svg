<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-label="Proyecto de predicción de criptomonedas (placeholder)">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#151b2e"/>
      <stop offset="1" stop-color="#3a1e4d"/>
    </linearGradient>
    <linearGradient id="coin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6c66b"/>
      <stop offset="1" stop-color="#e8963c"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="900" fill="url(#bg)"/>
  <g opacity="0.12" stroke="#ffffff" stroke-width="2">
    <path d="M0 300 H1200 M0 600 H1200 M300 0 V900 M600 0 V900 M900 0 V900"/>
  </g>
  <!-- velas japonesas -->
  <g>
    <g stroke="#7ee0c3" stroke-width="8">
      <line x1="180" y1="260" x2="180" y2="560"/>
      <line x1="330" y1="340" x2="330" y2="620"/>
      <line x1="630" y1="200" x2="630" y2="520"/>
      <line x1="780" y1="280" x2="780" y2="600"/>
    </g>
    <g fill="#7ee0c3">
      <rect x="150" y="300" width="60" height="200" rx="6"/>
      <rect x="300" y="380" width="60" height="180" rx="6"/>
      <rect x="600" y="240" width="60" height="200" rx="6"/>
      <rect x="750" y="320" width="60" height="200" rx="6"/>
    </g>
    <g stroke="#ff6f8a" stroke-width="8">
      <line x1="480" y1="280" x2="480" y2="640"/>
      <line x1="930" y1="220" x2="930" y2="520"/>
    </g>
    <g fill="#ff6f8a">
      <rect x="450" y="360" width="60" height="220" rx="6"/>
      <rect x="900" y="280" width="60" height="180" rx="6"/>
    </g>
  </g>
  <!-- moneda -->
  <circle cx="1060" cy="720" r="110" fill="url(#coin)"/>
  <text x="1060" y="760" font-family="Arial, sans-serif" font-size="130" font-weight="700" fill="#151b2e" text-anchor="middle">B</text>
  <!-- chispas -->
  <g fill="#f6c66b">
    <circle cx="900" cy="180" r="8"/>
    <circle cx="260" cy="180" r="6"/>
    <circle cx="1080" cy="240" r="6"/>
  </g>
</svg>
