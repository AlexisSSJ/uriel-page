<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-label="Proyecto de predicción de precios (placeholder)">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1d2433"/>
      <stop offset="1" stop-color="#2b3a55"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7ee0c3"/>
      <stop offset="1" stop-color="#4aa8e0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="900" fill="url(#bg)"/>
  <g opacity="0.12" stroke="#ffffff" stroke-width="2">
    <path d="M0 300 H1200 M0 600 H1200 M300 0 V900 M600 0 V900 M900 0 V900"/>
  </g>
  <!-- gráfica de barras -->
  <g fill="url(#accent)">
    <rect x="180" y="420" width="90" height="300" rx="10"/>
    <rect x="310" y="360" width="90" height="360" rx="10"/>
    <rect x="440" y="480" width="90" height="240" rx="10"/>
    <rect x="570" y="300" width="90" height="420" rx="10"/>
    <rect x="700" y="240" width="90" height="480" rx="10"/>
  </g>
  <!-- línea de tendencia -->
  <path d="M180 600 C320 540 420 500 700 300 L800 260" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round"/>
  <circle cx="800" cy="260" r="16" fill="#ffffff"/>
  <!-- casa -->
  <g stroke="#ffffff" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.9">
    <path d="M980 720 L1080 640 L1180 720"/>
    <path d="M1010 690 V760 H1150 V690"/>
  </g>
</svg>
